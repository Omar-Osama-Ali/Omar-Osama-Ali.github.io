<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Website Under Construction</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #111418;
      --text: #15191f;
      --line: #15191f;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      overflow: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 24px;
    }

    .content {
      width: min(900px, 100%);
      text-align: center;

      animation: pageIn 1s cubic-bezier(.22, 1, .36, 1) both;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      width: 190px;
      height: 190px;

      margin: 0 auto 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      animation:
        logoIn 1.2s cubic-bezier(.22, 1, .36, 1) both,
        logoFloat 5s ease-in-out 1.2s infinite;
    }

    .logo svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .logo-mark {
      fill: var(--black);
    }

    /* =========================
       CONSTRUCTION ICON
    ========================= */

    .construction {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;

      margin-bottom: 28px;

      animation: fadeUp .9s .25s both;
    }

    .construction-line {
      width: 62px;
      height: 2px;
      background: var(--line);
      border-radius: 100px;
    }

    .gear {
      width: 42px;
      height: 42px;

      animation: rotateGear 8s linear infinite;
    }

    .gear svg {
      width: 100%;
      height: 100%;
    }

    .gear path {
      fill: none;
      stroke: var(--line);
      stroke-width: 3;
      stroke-linejoin: round;
    }

    /* =========================
       TEXT
    ========================= */

    .website {
      font-size: clamp(26px, 4vw, 46px);
      font-weight: 300;
      letter-spacing: .28em;

      margin-left: .28em;
      margin-bottom: 8px;

      animation: fadeUp .9s .4s both;
    }

    .under-construction {
      font-size: clamp(34px, 6vw, 68px);
      line-height: 1.05;

      font-weight: 800;
      letter-spacing: .015em;

      animation: fadeUp .9s .5s both;
    }

    /* =========================
       PHONE
    ========================= */

    .phone {
      margin-top: 70px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;

      color: var(--text);
      text-decoration: none;

      font-size: clamp(20px, 3vw, 34px);
      font-weight: 400;
      letter-spacing: .04em;

      animation: fadeUp .9s .65s both;

      transition:
        transform .3s ease,
        opacity .3s ease;
    }

    .phone:hover {
      transform: translateY(-3px);
      opacity: .7;
    }

    .phone-icon {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    .phone-icon svg {
      width: 100%;
      height: 100%;
      fill: var(--black);
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes pageIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: translateY(-35px) scale(.88);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rotateGear {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 30px 20px;
      }

      .logo {
        width: 125px;
        height: 125px;
        margin-bottom: 48px;
      }

      .construction {
        gap: 14px;
        margin-bottom: 22px;
      }

      .construction-line {
        width: 38px;
      }

      .gear {
        width: 34px;
        height: 34px;
      }

      .website {
        font-size: 24px;
        letter-spacing: .20em;
        margin-left: .20em;
      }

      .under-construction {
        font-size: clamp(29px, 9vw, 48px);
        line-height: 1.1;
      }

      .phone {
        margin-top: 50px;
        font-size: 20px;
        gap: 12px;
      }

      .phone-icon {
        width: 24px;
        height: 24px;
      }
    }

    /* Reduce animation for accessibility */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
